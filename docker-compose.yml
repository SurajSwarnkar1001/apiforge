version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: apiforge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apiforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apiforge-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      DATABASE_URL: mongodb://mongodb:27017/apiforge_db?directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars-length
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ALLOW_LOCAL_TARGETS: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  discovery-worker:
    build:
      context: ./workers/discovery-worker
      dockerfile: Dockerfile
    container_name: apiforge-discovery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/apiforge_db?directConnection=true
      REDIS_URL: redis://redis:6379
      ALLOW_LOCAL_TARGETS: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  loadtest-worker:
    build:
      context: ./workers/loadtest-worker
      dockerfile: Dockerfile
    container_name: apiforge-loadtest-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongodb:27017/apiforge_db?directConnection=true
      REDIS_URL: redis://redis:6379
      ALLOW_LOCAL_TARGETS: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apiforge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodata:
  redisdata:
